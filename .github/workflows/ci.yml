name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (${{ matrix.build_type }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-x64-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ runner.arch }}-x64-

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DFASTMCPP_BUILD_TESTS=ON
          -DFASTMCPP_BUILD_EXAMPLES=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        # No explicit -G: pinning "Visual Studio 17 2022" broke the moment the
        # runner image moved past it ("could not find any instance of Visual
        # Studio"). CMake's default generator on a Windows runner is the newest
        # installed Visual Studio, so this follows the image instead of chasing
        # it. -A x64 still applies -- the default generator is a VS one, which
        # is also what the MSBuild flags in the build step below require.
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build/CMakeCache.txt, build/CMakeFiles -ErrorAction SilentlyContinue }
          cmake -B build -S . -A x64 -DFASTMCPP_BUILD_TESTS=ON -DFASTMCPP_BUILD_EXAMPLES=ON

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 2

      - name: Build (Windows)
        if: runner.os == 'Windows'
        # Single-threaded build to avoid C1060 "compiler out of heap space" on GitHub's 16GB Windows runners
        # Even /m:4 exhausts heap with deeply nested JSON initializers in test files
        run: cmake --build build --config ${{ matrix.build_type }} -- /m:1 /p:CL_MPCount=1

      - name: Test
        # --timeout so a hung test fails its own case instead of running to the
        # job limit. There is no per-test TIMEOUT property on most of these, and a
        # blocked process would otherwise hold the whole leg for hours.
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --timeout 300

  # The default matrix never sets FASTMCPP_ENABLE_CURL_TRANSPORT, so without this
  # job the libcurl transport is the one piece of the client that CI never
  # compiles -- on exactly the platforms it exists for. WinHTTP needs no
  # equivalent: it is on by default and windows-latest is already in the matrix.
  curl-transport:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (curl transport)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build-curl/_deps
          key: curl-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            curl-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure
        run: >
          cmake -B build-curl -S .
          -DCMAKE_BUILD_TYPE=Release
          -DFASTMCPP_BUILD_TESTS=ON
          -DFASTMCPP_BUILD_EXAMPLES=OFF
          -DFASTMCPP_ENABLE_CURL_TRANSPORT=ON

      - name: Build
        run: cmake --build build-curl --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build-curl -C Release --output-on-failure --timeout 300
